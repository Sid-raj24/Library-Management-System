<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library System - Authentication</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f9; margin: 0; }
    .auth-card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
    .hidden { display: none; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    a { color: #007bff; text-decoration: none; font-size: 0.9rem; }
    .reset-fields { margin-top: 15px; }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Login View -->
    <div id="login-view">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email" value="">
      <input type="password" id="login-password" placeholder="Password" value="">
      <button onclick="login()">Log In</button>
      <p><a href="#" onclick="switchView('forgot')">Forgot Password?</a></p>
      <p><a href="#" onclick="switchView('register')">Register</a></p>
    </div>

    <!-- Register View -->
    <div id="register-view" class="hidden">
      <h2>Student Registration</h2>
      <input type="text" id="reg-name" placeholder="Full Name">
      <input type="email" id="reg-email" placeholder="Email">
      <input type="password" id="reg-password" placeholder="Password">
      <button onclick="register()">Register</button>
      <p><a href="#" onclick="switchView('login')">Back to Login</a></p>
    </div>

    <!-- Forgot Password View -->
    <div id="forgot-view" class="hidden">
      <h2>Forgot Password</h2>
      
      <!-- Step 1: Email -->
      <div id="step-email">
        <input type="email" id="forgot-email" placeholder="Registered Email">
        <button onclick="requestOtp()">Send OTP</button>
      </div>

      <!-- Step 2: OTP -->
      <div id="step-otp" class="hidden" style="margin-top: 15px;">
        <p>Check your email for the 6-digit code.</p>
        <input type="text" id="reset-otp" placeholder="Enter OTP">
        <button onclick="verifyOtp()">Verify OTP</button>
      </div>

      <!-- Step 3: New Password -->
      <div id="step-new-password" class="hidden" style="margin-top: 15px;">
        <input type="password" id="new-password" placeholder="Enter New Password">
        <button onclick="submitNewPassword()">Set New Password</button>
      </div>

      <p><a href="#" onclick="switchView('login')">Back to Login</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
